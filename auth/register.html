<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SosyalTrend • Kayıt Ol</title>
  <link rel="icon" type="image/x-icon" href="/assets/img/strendsaydamv2.ico">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
<div class="wrapper">
  <div class="left">
    <div style="font-size:3.5rem;margin-bottom:15px;">✨</div>
    <h1>SosyalTrend</h1>
    <p>Trendleri yakalamak ve topluluğa katılmak için hemen aramıza katılın.</p>
  </div>
  <div class="card">
    <h1>💾 Kayıt Ol</h1>
    <p class="subtitle">Ücretsiz hesabınızı hemen oluşturun</p>
    <form id="registerForm">
        <input id="regName" type="text" placeholder="Ad Soyad" required />
        <input id="regUsername" type="text" placeholder="Kullanıcı Adı" required />
        <input id="regEmail" type="email" placeholder="E‑posta Adresi" required autocomplete="email" />
        <input id="regPassword" type="password" placeholder="Şifre (en az 6 karakter)" required autocomplete="new-password" />
        <button type="submit">Hesabımı Oluştur</button>
    </form>
    <p id="regMsg" class="authMsg"></p>
    <a href="/auth/google" class="toggle-link" style="background:#db4437;color:#fff;padding:8px;border-radius:8px;display:block;margin:10px auto;text-decoration:none;">Google ile Kayıt</a>
    <a href="/auth/login.html" class="toggle-link">Zaten hesabınız var mı? Giriş Yap</a>
  </div>
</div>
<footer class="site-footer">
  <div class="footer-links">
    <a href="#">© 2026 SosyalTrend</a>
    <a href="#">S.S.S</a>
    <a href="#">Gizlilik Politikası</a>
    <a href="#">Hakkımızda</a>
    <a href="#">İletişim</a>
  </div>
</footer>

<script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
