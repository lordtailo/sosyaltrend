<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Sosyal Ağ - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<style>
        :root { --primary: #6366f1; --danger: #ef4444; --success: #10b981; --warning: #f59e0b; }
        .admin-main { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { padding: 20px; text-align: center; border: 1px solid var(--border); }
        .stat-card i { font-size: 2rem; color: var(--primary); margin-bottom: 10px; }
        .stat-card h3 { font-size: 1.8rem; margin: 5px 0; }
        .stat-card p { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }
        .admin-tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); padding: 8px 16px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .admin-section { display: none; }
        .admin-section.active { display: block; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .user-row img { width: 32px; height: 32px; border-radius: 50%; vertical-align: middle; margin-right: 10px; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; }
        .badge-admin { background: var(--primary); color: white; }
        .badge-user { background: var(--border); color: var(--text-main); }
        .action-btn { padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }
  </style>
  
<div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

 <main id="main-content">



  <div class="stat-grid">
        <div class="glass-card stat-card"><i class="fa-solid fa-signs-post"></i><h3 id="stat-posts">0</h3><p>Toplam Gönderi</p></div>
        <div class="glass-card stat-card"><i class="fa-solid fa-users-gear"></i><h3 id="stat-users">0</h3><p>Aktif Kullanıcılar</p></div>
    </div>

    <div class="glass-card" style="padding: 25px;">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchTab('announcement')">Sistem Duyurusu</button>
            <button class="tab-btn" onclick="switchTab('users')">Kullanıcı Yönetimi</button>
            <button class="tab-btn" onclick="switchTab('moderation')">İçerik Denetimi</button>
        </div>

        <div id="section-announcement" class="admin-section active">
            <div class="section-subtitle">Tüm Sisteme Duyuru Yayınla</div>
            <textarea id="adminNoticeInput" class="form-input" style="min-height: 120px; margin-bottom: 15px;" placeholder="Tüm kullanıcılara görünecek resmi bir duyuru yazın..."></textarea>
            <button id="broadcastBtn" class="form-btn" style="width: auto; padding: 12px 30px;"><i class="fa-solid fa-paper-plane"></i> Duyuruyu Tüm Sisteme Gönder</button>
        </div>

        <div id="section-users" class="admin-section">
            <div class="section-subtitle">Kullanıcı Veritabanı (Son Etkileşimler)</div>
            <table class="data-table">
                <thead><tr><th>Kullanıcı</th><th>Kullanıcı Adı</th><th>Rol</th><th>İşlem</th></tr></thead>
                <tbody id="user-list-body"></tbody>
            </table>
        </div>

        <div id="section-moderation" class="admin-section">
            <div class="section-subtitle">Tüm Paylaşımları Yönet</div>
            <div id="admin-feed-list"></div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, orderBy, limit, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBegJHqlfPagx8biFyS_FnE3iXOksgfoAU",
        authDomain: "sosyaltrend-21d21.firebaseapp.com",
        projectId: "sosyaltrend-21d21",
        storageBucket: "sosyaltrend-21d21.firebasestorage.app",
        messagingSenderId: "207734473261",
        appId: "1:207734473261:web:f31b6bf2908c6d88986ea4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const ADMIN_EMAIL = "officialfthuzun@gmail.com";

    let isAdminInitialized = false;

    onAuthStateChanged(auth, (user) => {
        if (!user || user.email !== ADMIN_EMAIL) {
            alert("Yetkisiz Erişim!");
            window.location.href = "index.html";
        } else {
            if (!isAdminInitialized) {
                initAdmin();
                isAdminInitialized = true;
            }
        }
    });

    async function initAdmin() {
        try {
            // 1. Verileri Çek
            const postsSnap = await getDocs(collection(db, "posts"));
            const usersSnap = await getDocs(collection(db, "users"));
            
            document.getElementById('stat-posts').innerText = postsSnap.size;
            document.getElementById('stat-users').innerText = usersSnap.size;

            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = "";

            // 2. İsimleri garantiye almak için bir eşleştirme objesi oluştur
            let userMap = {};
            
            // Önce kullanıcılar tablosundaki mevcut verileri al
            usersSnap.forEach(uDoc => {
                const u = uDoc.data();
                userMap[u.username] = {
                    id: uDoc.id,
                    name: u.name,
                    avatar: u.avatarSeed,
                    role: u.role || 'user'
                };
            });

            // 3. Tabloyu Oluştur
            Object.keys(userMap).forEach(uname => {
                const userData = userMap[uname];
                
                // KRİTİK DÜZELTME: Eğer name alanı boş/undefined ise kullanıcı adını göster
                // Admin'in ismi nasıl görünüyorsa aynı mantığı buraya kurduk.
                const finalName = (userData.name && userData.name !== "İsimsiz") ? userData.name : uname;
                
                // AVATAR DÜZELTME: Eğer avatarSeed yoksa, ismi kullanarak otomatik avatar oluştur
                const finalAvatar = userData.avatar || uname || "1";

                const isThisAdmin = uname === ADMIN_EMAIL.split('@')[0] || userData.role === 'admin';

                tbody.innerHTML += `
                    <tr class="user-row">
                        <td style="display:flex; align-items:center; gap:10px;">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${finalAvatar}" 
                                 style="width:38px; height:38px; border-radius:50%; background:#f1f1f1; border:1px solid #ddd;"
                                 onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=fallback'">
                            <b style="font-size: 0.95rem;">${finalName}</b>
                        </td>
                        <td><span style="color:var(--primary); font-weight:500;">@${uname}</span></td>
                        <td>
                            <span class="badge ${isThisAdmin ? 'badge-admin' : 'badge-user'}">
                                ${isThisAdmin ? 'Admin' : 'Üye'}
                            </span>
                        </td>
                        <td>
                            <div style="display:flex; gap:5px;">
                                <button class="action-btn" style="background:rgba(99,102,241,0.1); color:var(--primary);" 
                                    onclick="toggleAdminRole('${userData.id}', '${userData.role}')">
                                    <i class="fa-solid fa-shield-halved"></i> Yetki
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteUserAccount('${userData.id}')">
                                    <i class="fa-solid fa-trash-can"></i> Sil
                                </button>
                            </div>
                        </td>
                    </tr>`;
            });
        } catch (e) { 
            console.error("Yükleme hatası:", e); 
        }
        loadAllPosts();
    }

    // --- Fonksiyonlar ---
    window.toggleAdminRole = async (userId, currentRole) => {
        const newRole = currentRole === 'admin' ? 'user' : 'admin';
        if(confirm("Kullanıcı rolü güncellensin mi?")) {
            await updateDoc(doc(db, "users", userId), { role: newRole });
            initAdmin();
        }
    };

    window.deleteUserAccount = async (userId) => {
        if(confirm("Kullanıcıyı silmek istediğinize emin misiniz?")) {
            await deleteDoc(doc(db, "users", userId));
            initAdmin();
        }
    };

    window.switchTab = (tabId) => {
        document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + tabId).classList.add('active');
        if(event) event.target.classList.add('active');
    };

    async function loadAllPosts() {
        const q = query(collection(db, "posts"), orderBy("timestamp", "desc"), limit(20));
        onSnapshot(q, (snap) => {
            const container = document.getElementById('admin-feed-list');
            container.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                container.innerHTML += `
                    <div class="glass-card" style="padding:15px; margin-bottom:10px; display:flex; border-left: 4px solid var(--primary); justify-content:space-between; align-items:center;">
                        <div><small>@${p.username}</small><p style="margin:5px 0;">${p.content ? p.content.substring(0, 100) : "..."}</p></div>
                        <button class="action-btn btn-delete" onclick="deletePostAdmin('${d.id}')">Sil</button>
                    </div>`;
            });
        });
    }

    window.deletePostAdmin = async (id) => {
        if(confirm("Silinsin mi?")) await deleteDoc(doc(db, "posts", id));
    };

    document.getElementById('broadcastBtn').onclick = async () => {
        const content = document.getElementById('adminNoticeInput').value.trim();
        if(!content) return;
        await addDoc(collection(db, "posts"), {
            name: "Sistem Duyurusu",
            username: "official_system",
            avatarSeed: "admin-shield",
            content: content,
            timestamp: serverTimestamp(),
            likes: [], savedBy: [], comments: []
        });
        alert("Duyuru yayınlandı!");
        document.getElementById('adminNoticeInput').value = "";
    };
</script>

<div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>  

<div id="editModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 90%; max-width: 500px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <h3 style="margin: 0;">Gönderiyi Düzenle</h3>
            <button onclick="closeEditModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">&times;</button>
        </div>
        <textarea id="editPostInput" style="width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: transparent; color: var(--text-main); outline: none; resize: vertical;"></textarea>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button onclick="closeEditModal()" style="padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer;">İptal</button>
            <button id="saveEditBtn" style="padding: 8px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">Kaydet</button>
        </div>
    </div>
</div>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>

</body>
</html>
