<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Blog Yazısı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog-post" class="page-content active">
      <div class="glass-card" style="padding:20px;">
        <h2 id="blogPostTitle" style="margin-bottom:15px; color:var(--primary);">...</h2>
        <p id="blogPostContent" style="white-space:pre-wrap; line-height:1.6; color:var(--text-main);">Yükleniyor...</p>
      </div>
    </div>

  </main>

  <div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>

<script>
  async function loadBlogPost() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) return;
    try {
      const docRef = doc(db, 'blogs', id);
      const snap = await getDoc(docRef);
      if (!snap.exists()) {
        document.getElementById('blogPostTitle').textContent = 'Yazı bulunamadı';
        document.getElementById('blogPostContent').textContent = '';
        return;
      }
      const data = snap.data();
      document.getElementById('blogPostTitle').textContent = data.title || '';
      document.getElementById('blogPostContent').textContent = data.content || '';
      // highlight menu depending on owner
      if (data.authorUid && auth.currentUser && data.authorUid === auth.currentUser.uid) {
          document.getElementById('btn-blog-mine')?.classList.add('active');
          // add delete button
          const del = document.createElement('button');
          del.className = 'mini-link-btn';
          del.style.cssText = 'background:#ef4444;color:#fff;margin-top:10px;';
          del.textContent = 'Sil';
          del.onclick = () => {
              if (confirm('Bu yazıyı silmek istediğinizden emin misiniz?')) {
                  deleteBlogPost(id);
                  location.href = 'blog.html?mine=1';
              }
          };
          document.getElementById('blogPostContent').after(del);
      } else {
          document.getElementById('btn-blog-all')?.classList.add('active');
      }
    } catch(e) {
      console.error('loadBlogPost hata:', e);
      document.getElementById('blogPostContent').textContent = 'Yüklenirken hata oluştu.';
    }
  }
  document.addEventListener('DOMContentLoaded', loadBlogPost);
</script>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
