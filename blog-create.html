<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Yeni Blog Yazısı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<div id="header-placeholder"></div>

<script>
console.log('[blog-create] Loading header...');
fetch('partials/header.html')
  .then(r => {
    console.log('[blog-create] Header fetch response:', r.status);
    return r.text();
  })
  .then(html => {
    const el = document.getElementById('header-placeholder');
    console.log('[blog-create] Header element found:', !!el, 'HTML length:', html.length);
    if (el) {
      el.innerHTML = html;
      console.log('[blog-create] Header inserted successfully');
    }
  })
  .catch(e => {
    console.error('[blog-create] Header fetch error:', e);
    console.warn('[blog-create] Header failed to load - refresh page');
  });
</script>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog-create" class="page-content active">
      <div class="glass-card" style="padding:20px; max-width:600px; margin:20px auto;">
        <h2 style="margin-bottom:15px; color:var(--primary);">Yeni Blog Yazısı</h2>
        <form id="blogForm" onsubmit="return false;">
          <label class="form-label" for="blogTitle">Başlık</label>
          <input type="text" id="blogTitle" class="form-input" placeholder="Yazı başlığını yazın...">

          <label class="form-label" for="blogContent" style="margin-top:10px;">İçerik</label>
          <textarea id="blogContent" class="form-input" rows="8" style="resize: vertical;" placeholder="Yazınızı buraya yazın..."></textarea>

          <button id="publishBlogBtn" type="button" class="form-btn" style="margin-top: 15px;" onclick="publishBlogPost().catch(e=>console.error('inline click error',e));">
            <i class="fa-solid fa-paper-plane"></i> Yayınla
          </button>
          <p id="blogStatus" style="margin-top: 15px; font-weight: 600; text-align: center;"></p>
        </form>
      </div>
    </div>

  </main>

  <div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>

<script>
console.log('[blog-create] Loading footer...');
fetch('partials/footer.html')
  .then(r => {
    console.log('[blog-create] Footer fetch response:', r.status);
    return r.text();
  })
  .then(html => {
    const el = document.getElementById('footer-placeholder');
    console.log('[blog-create] Footer element found:', !!el, 'HTML length:', html.length);
    if (el) {
      el.innerHTML = html;
      console.log('[blog-create] Footer inserted successfully');
    }
  })
  .catch(e => {
    console.error('[blog-create] Footer fetch error:', e);
    console.warn('[blog-create] Footer failed to load - refresh page');
  });
</script>



<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
