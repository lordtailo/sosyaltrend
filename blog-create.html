<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Yeni Blog Yazısı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog-create" class="page-content active">
      <div class="glass-card" style="padding:20px; max-width:600px; margin:20px auto;">
        <h2 style="margin-bottom:15px; color:var(--primary);">Yeni Blog Yazısı</h2>
        <form id="blogForm" onsubmit="return false;">
          <label class="form-label" for="blogTitle">Başlık</label>
          <input type="text" id="blogTitle" class="form-input" placeholder="Yazı başlığını yazın...">

          <label class="form-label" for="blogContent" style="margin-top:10px;">İçerik</label>
          <textarea id="blogContent" class="form-input" rows="8" style="resize: vertical;" placeholder="Yazınızı buraya yazın..."></textarea>

          <button id="publishBlogBtn" type="button" class="form-btn" style="margin-top: 15px;">
            <i class="fa-solid fa-paper-plane"></i> Yayınla
          </button>
          <p id="blogStatus" style="margin-top: 15px; font-weight: 600; text-align: center;"></p>
        </form>
      </div>
    </div>

  </main>

  <div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>

<script>
  document.getElementById('publishBlogBtn').addEventListener('click', () => {
    const title = document.getElementById('blogTitle').value.trim();
    const content = document.getElementById('blogContent').value.trim();
    const status = document.getElementById('blogStatus');

    if (!title || !content) {
      status.textContent = 'Lütfen başlık ve içerik girin.';
      status.style.color = '#ef4444';
      return;
    }
    // burada Firestore'a kayıt logic'i eklenebilir
    status.textContent = '✅ Yazınız kaydedildi (şimdilik sadece önizleme).';
    status.style.color = '#10b981';
    // form temizle
    document.getElementById('blogTitle').value = '';
    document.getElementById('blogContent').value = '';
  });
</script>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
