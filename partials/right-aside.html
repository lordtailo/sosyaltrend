<aside class="right-panel">
    <div class="glass-card sidebar-container" style="margin-bottom:12px;">
        <div class="sidebar-title"><i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="rightSearchTitle">Arama</span></div>
        <div style="padding: 0 5px 5px 5px;">
            <form action="search.html" method="GET" style="display:flex; gap:8px; align-items:center;">
                <div class="search-wrapper" style="flex:1;">
                    <input type="text" name="q" id="globalSearch" placeholder="Aramak istediğin şeyi yaz." data-i18n-placeholder="rightSearchPlaceholder">
                </div>
                <button type="submit" id="mainSearchBtn" style="background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 50px; font-weight: 700; cursor: pointer; display:flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-magnifying-glass"></i> <span data-i18n="rightSearchBtn">Ara</span>
                </button>
            </form>
        </div>
    </div>

    <div class="glass-card sidebar-container" style="margin-bottom:12px;">
        <div class="sidebar-title"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="calendarTitle">Takvim</span></div>
        <div style="padding: 0 8px;">
            <div id="rightCalendarNav" class="calendar-nav"></div>
            <div id="rightCalendar" class="calendar-grid" style="gap: 6px; margin-bottom: 12px;"></div>
        </div>
        
        <!-- Yaklaşan Etkinlikler -->
        <div style="margin-top: 18px; padding: 14px 8px 4px; border-top: 1px solid rgba(99, 102, 241, 0.15);">
            <div id="upcomingEventsTitle" data-i18n="upcomingEventsTitle" style="font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 10px; padding: 0 2px;">Yaklaşan Etkinlikler</div>
            <div id="upcomingEventsList" style="display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding: 0 2px;">
                <div data-i18n="noUpcomingEvents" style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 16px 8px;">Yaklaşan etkinlik yok</div>
            </div>
        </div>
    </div>


    <div class="glass-card sidebar-container" style="margin-top: 20px;">
        <div class="sidebar-title"><i class="fa-solid fa-users"></i> <span data-i18n="topCommunitiesTitle">En popüler 3 topluluk sayfası</span></div>
        <div id="recentCommunitiesWidgetList" style="display: flex; flex-direction: column; gap: 10px; padding: 5px;"></div>
    </div>

    <div class="glass-card sidebar-container" style="margin-top: 20px;">
        <div class="sidebar-title"><i class="fa-solid fa-user-group"></i> <span data-i18n="friendSuggestionsTitle">Arkadaş Önerileri</span></div>
        <div id="dynamic-suggestions-list" style="display: flex; flex-direction: column; gap: 8px; padding: 4px; max-height: 230px; overflow-y: auto;">
            <div data-i18n="loadingText" style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Yükleniyor...</div>
        </div>
    </div>

    <script type="module" src="assets/js/common.js"></script>
</aside>
