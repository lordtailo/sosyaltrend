<aside class="right-panel">
    <!-- search form above clock -->
    <div class="glass-card" style="margin-bottom:12px; padding:12px;">
        <form action="search.html" method="GET" style="display:flex; gap:8px; align-items:center;">
            <div class="search-wrapper" style="flex:1;">
                <input type="text" name="q" id="globalSearch" placeholder="Ara...">
            </div>
            <button type="submit" id="mainSearchBtn" style="background: var(--primary); color: white; border: none; padding: 8px 18px; border-radius: 50px; font-weight: 700; cursor: pointer; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-magnifying-glass"></i> Ara
            </button>
        </form>
    </div>
    <div class="glass-card widget-clock">
      <div class="analog-clock">
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand min-hand" id="minHand"></div>
        <div class="hand sec-hand" id="secHand"></div>
      </div>
      <div id="digiClock" style="font-size: 1.5rem; font-weight: 800;"> 00:00:00</div>
      <div id="dateDisplay" class="date-display"> ...</div>
    </div>
    <div class="glass-card" style="margin-top: 20px; padding: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="font-size: 0.95rem; margin: 0; font-weight: 800; color: var(--text-main);">✨ Arkadaş Önerileri</h3>
    </div>
    <div id="dynamic-suggestions-list" style="display: flex; flex-direction: column; gap: 12px;">
        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Yükleniyor...</div>
    </div>
</div>
  </aside>
