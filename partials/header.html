<header>
  <div class="header-left">
    <button class="side-trigger left-trigger" type="button" onclick="toggleLeftSidebar()" aria-label="Sol menüyü aç">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
  <div class="header-center">
    <a href="javascript:void(0)" onclick="navigateTo('feed'); return false;" class="header-logo-link">
      <div class="logo-container">
        <div class="logo-icon">
          <img src="assets/img/strendsaydamv2.png" alt="ST logo" />
        </div>
      </div>
    </a>
    <div class="header-nav-buttons">
      <button type="button" class="header-nav-btn home-nav-btn" onclick="navigateTo('feed'); return false;" title="Ana Sayfa">
        <i class="fa-solid fa-house"></i>
        <span>Ana Sayfa</span>
      </button>
      <div class="friends-dropdown-wrapper">
        <button id="friendsBtn" type="button" class="header-nav-btn" onclick="toggleFriendsDropdown(); return false;" title="Arkadaşlar" aria-expanded="false">
          <i class="fa-solid fa-user-friends"></i>
          <span>Arkadaşlar</span>
          <span id="friendsOnlineCount" class="header-friends-online-count">(0)</span>
        </button>
        <div id="friendsDropdown" class="friends-dropdown" style="display:none;">
          <div class="friends-dropdown-title">
            <span>Arkadaşlarım <small id="friendsCountBadge" class="friends-count-badge">0</small></span>
            <button type="button" class="friends-dropdown-close" onclick="toggleFriendsDropdown()" aria-label="Kapat">×</button>
          </div>
          <div class="friends-dropdown-search">
            <input id="friendsSearchInput" type="search" placeholder="Arkadaş ara..." aria-label="Arkadaş ara" oninput="filterHeaderFriends()" />
          </div>
          <div id="headerFriendsList" class="friends-dropdown-list">
            <div class="friends-dropdown-empty">Arkadaşlar yükleniyor...</div>
          </div>
          <div class="friends-dropdown-footer">
            <a href="profil.html#friends">Tümünü Gör</a>
          </div>
        </div>
      </div>
      <div class="notification-wrapper">
        <button id="notificationsBtn" type="button" class="header-nav-btn" onclick="toggleNotifications(); return false;" title="Bildirimler">
          <i class="fa-solid fa-bell"></i>
          <span>Bildirim</span>
          <span id="notificationCountBadge" class="notificationCountBadge nav-badge" style="display:none;">0 okunmamış</span>
          <span id="notificationBadge" class="nav-dot-badge" style="display:none;"></span>
        </button>
        <div id="notificationsDropdown" class="notifications-dropdown" style="display:none;">
          <div style="padding:12px 15px; border-bottom:1px solid var(--border); background:linear-gradient(135deg, var(--primary), #8b5cf6); color:white; border-radius:12px 12px 0 0; flex-shrink:0; display:flex; align-items:center; gap:10px; justify-content:space-between;">
            <div style="display:flex; align-items:center; gap:10px; flex:1;">
              <i class="fa-solid fa-bell"></i>
              <h4 style="margin:0; font-size:0.95rem; font-weight:700; display:inline-block;">Bildirim Kutusu</h4>
              <span class="requestCountBadge notificationCountBadge" style="background:rgba(255,255,255,0.3); padding:2px 8px; border-radius:12px; font-size:0.8rem; font-weight:600;">0 okunmamış</span>
            </div>
            <button onclick="navigateToProfileHash('my-notifs-tab'); return false;" style="background: rgba(255,255,255,0.18); color: white; border: none; padding:6px 10px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-weight:700; white-space:nowrap; transition: all 0.2s ease;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.18)';">
              <i class="fa-solid fa-arrow-right"></i> Bildirimlerime Git
            </button>
          </div>
          <div id="friendRequestsList" style="flex:1; overflow-y:auto;"></div>
          <div id="noNotificationsMsg" style="padding:30px 20px; text-align:center; color:var(--text-muted); font-size:0.85rem; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <i class="fa-solid fa-inbox" style="font-size:2rem; margin-bottom:12px; opacity:0.5;"></i>
            <p style="margin:0; font-weight:500;">Yeni bildirim yok</p>
          </div>
        </div>
      </div>
    </div>
    <div class="header-search" id="headerSearchWrapper">
      <button id="headerSearchButton" class="theme-btn" type="button" title="Ara" onclick="toggleHeaderSearch(event)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div id="headerSearchBox" class="search-wrapper" style="display:none;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="headerSearchInput" type="search" placeholder="Ara..." aria-label="Site içinde ara" />
        <button id="headerSearchSubmit" class="header-search-submit" type="button" title="Arama yap">
          Ara
        </button>
      </div>
    </div>
    <div class="header-tools">
      <button id="themeToggleBtn" class="theme-btn" onclick="toggleDarkMode()" title="Tema Değiştir"><i class="fa-solid fa-moon"></i></button>
      <button id="sendHeaderMessageBtn" class="header-msg-btn" onclick="openChatsList()" title="Mesaj Gönder">
        <i class="fa-solid fa-comments"></i>
        <span>Sohbet Et</span>
        <span id="header-chat-unread" class="nav-badge" style="display:none; margin-left:8px;">0</span>
      </button>
      <div class="profile-trigger" id="profileTrigger">
        <div class="avatar-wrap offline" id="headerAvatarWrap">
          <img id="headerAvatar" src="" alt="Kullanıcı avatar">
          <span class="status-badge status-offline"></span>
        </div>
      </div>
      <div class="dropdown-menu" id="dropdownMenu">
        <div style="padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 5px;">
          <p id="menuDisplayName" style="font-weight: 800; font-size: 0.85rem;">...</p>
          <p id="menuUsername" style="font-size: 0.75rem; color: var(--text-muted);">@...</p>
        </div>
        <button class="menu-style-btn" onclick="navigateTo('profil'); return false;"><i class="fa-solid fa-user"></i> <span data-i18n="menuProfile">Profiliniz</span></button>
        <button class="menu-style-btn" id="adminMenuBtn" onclick="navigateTo('admin'); return false;" style="display:none; color: var(--primary);">
          <i class="fa-solid fa-user-shield"></i> <span>Yönetici Paneli</span>
        </button>
        <button class="menu-style-btn" onclick="navigateTo('settings'); return false;"><i class="fa-solid fa-gear"></i> <span>Ayarlar</span></button>
        <button class="menu-style-btn" onclick="logout()" style="color:#ef4444; border-top:1px solid var(--border); margin-top:5px;"><i class="fa-solid fa-right-from-bracket"></i> <span>Çıkış Yap</span></button>
      </div>
    </div>
  </div>
  <div class="header-right">
    <button class="side-trigger right-trigger" type="button" onclick="toggleRightSidebar()" aria-label="Sağ menüyü aç">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>
  <button id="closePanelBtn" class="header-close-panel" onclick="closeSideMenus()" aria-label="Menüyü kapat">×</button>
</header>
<div id="headerInlineSearchResults" class="header-search-results" style="display:none;">
  <div class="header-search-results-card">
    <div class="header-search-results-title">
      <span id="headerSearchResultsTitle">Arama sonuçları</span>
      <button type="button" id="headerSearchResultsClose" class="header-search-results-close" aria-label="Kapat">×</button>
    </div>
    <div id="headerSearchResultsList" class="header-search-results-list"></div>
  </div>
</div>
