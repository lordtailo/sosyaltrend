<header>
  <div class="header-left">
    <button class="side-trigger left-trigger" type="button" onclick="toggleLeftSidebar()" aria-label="Sol menüyü aç">
      <span class="icon-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="5" width="18" height="2" rx="1" fill="currentColor" />
          <rect x="3" y="11" width="18" height="2" rx="1" fill="currentColor" opacity="0.8" />
          <rect x="3" y="17" width="12" height="2" rx="1" fill="currentColor" opacity="0.6" />
        </svg>
      </span>
    </button>
  </div>
  <div class="header-center">
    <a href="javascript:void(0)" onclick="navigateTo('feed'); return false;" class="header-logo-link">
      <div class="logo-container">
        <div class="logo-icon">
          <img src="assets/img/strendsaydamv2.png" alt="ST logo" />
        </div>
      </div>
    </a>
    <div class="header-nav-buttons">
      <div class="friends-dropdown-wrapper">
        <button id="friendsBtn" type="button" class="header-nav-btn" onclick="toggleFriendsDropdown(); return false;" title="Arkadaşlar" aria-expanded="false">
          <i class="fa-solid fa-user-friends"></i>
          <span data-i18n="headerFriends">Arkadaşlar</span>
          <span id="friendsOnlineCount" class="header-friends-online-count">(0)</span>
        </button>
        <div id="friendsDropdown" class="friends-dropdown" style="display:none;">
          <div class="friends-dropdown-title">
            <span><i class="fa-solid fa-user-friends"></i> <span data-i18n="headerMyFriends">Arkadaşlarım</span> <small id="friendsCountBadge" class="friends-count-badge">0</small></span>
            <button type="button" class="friends-dropdown-close" onclick="toggleFriendsDropdown()" aria-label="Kapat">×</button>
          </div>
          <div class="friends-dropdown-search">
            <input id="friendsSearchInput" type="search" placeholder="Arkadaş ara..." aria-label="Arkadaş ara" oninput="filterHeaderFriends()" />
          </div>
          <div id="headerFriendsList" class="friends-dropdown-list">
            <div class="friends-dropdown-empty" data-i18n="headerFriendsLoading">Arkadaşlar yükleniyor...</div>
          </div>
          <div class="friends-dropdown-footer">
            <a href="profil.html#friends"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="headerSeeAll">Tümünü Gör</span></a>
          </div>
        </div>
      </div>
      
    </div>
    <div class="header-search" id="headerSearchWrapper">
      <button id="headerSearchButton" class="theme-btn" type="button" title="Ara" onclick="toggleHeaderSearch(event)">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <div id="headerSearchBox" class="search-wrapper" style="display:none;">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="headerSearchInput" type="search" placeholder="Ara..." aria-label="Site içinde ara" />
        <button id="headerSearchSubmit" class="header-search-submit" type="button" title="Arama yap">
          <span data-i18n="searchBtn">Ara</span>
        </button>
      </div>
    </div>
    <div class="header-tools">
      <div class="notification-wrapper">
        <button id="notificationsBtn" type="button" class="header-msg-btn" onclick="toggleNotifications(); return false;" title="Bildirimler">
          <i class="fa-solid fa-bell"></i>
          <span data-i18n="headerNotification">Bildirim</span>
          <span id="notificationBadge" class="nav-dot-badge" style="display:none;"></span>
        </button>
        <div id="notificationsDropdown" class="notifications-dropdown chat-like" style="display:none;">
          <div class="friends-dropdown-title">
            <span><i class="fa-solid fa-bell"></i> <span data-i18n="headerInbox">Bildirim Kutusu</span></span>
            <button type="button" class="friends-dropdown-close" onclick="toggleNotifications()" aria-label="Kapat">×</button>
          </div>
          <div class="friends-dropdown-list">
            <div id="friendRequestsList"></div>
            <div id="noNotificationsMsg" class="friends-dropdown-empty" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px 20px;">
              <i class="fa-solid fa-inbox" style="font-size:2rem; margin-bottom:12px; opacity:0.5;"></i>
              <p style="margin:0; font-weight:500;" data-i18n="headerNoNotifications">Yeni bildirim yok</p>
            </div>
          </div>
          <div class="friends-dropdown-footer">
            <a href="profil.html#my-notifs-tab"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="headerGoNotifications">Bildirime Git</span></a>
          </div>
        </div>
      </div>
      <button id="headerChatBtn" class="header-msg-btn" type="button" onclick="if (typeof openChatsList === 'function') { openChatsList(); } return false;" title="Sohbet">
        <i class="fa-solid fa-comments"></i>
        <span data-i18n="headerChat">Sohbet</span>
      </button>
      <div class="profile-trigger" id="profileTrigger" title="Profil menüsü" aria-label="Profil menüsü" role="button" tabindex="0" onclick="event.stopPropagation(); window.toggleProfileDropdown && window.toggleProfileDropdown(this); return false;" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); window.toggleProfileDropdown && window.toggleProfileDropdown(this); }">
        <div class="avatar-wrap offline" id="headerAvatarWrap">
          <img id="headerAvatar" src="assets/img/strendsaydamv2.png" alt="Kullanıcı avatar">
          <span class="status-badge status-offline"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="header-right">
    <button class="side-trigger right-trigger" type="button" onclick="toggleRightSidebar()" aria-label="Sağ menüyü aç">
      <span class="icon-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="6" cy="7" r="1.8" fill="currentColor" />
          <circle cx="12" cy="7" r="1.8" fill="currentColor" opacity="0.85" />
          <circle cx="18" cy="7" r="1.8" fill="currentColor" opacity="0.7" />
          <path d="M6 16c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2z" fill="currentColor" opacity="0.9" />
          <path d="M12 16c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2z" fill="currentColor" opacity="0.7" />
          <path d="M18 16c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2z" fill="currentColor" opacity="0.5" />
        </svg>
      </span>
    </button>
  </div>
  <!-- Floating theme control for mobile (right-middle) -->
  <button id="floatingThemeBtn" class="floating-theme-btn" aria-label="Tema seçenekleri" style="display:none;">
    <i class="fa-solid fa-moon"></i>
  </button>
  <div id="floatingThemeMenu" class="floating-theme-menu" style="display:none;">
    <button type="button" id="themeToggleBtnMobile">Tema Değiştir</button>
    <button type="button" data-theme="light">Açık</button>
    <button type="button" data-theme="dark">Koyu</button>
    <button type="button" data-theme="auto">Otomatik</button>
  </div>
</header>
<div id="headerInlineSearchResults" class="header-search-results" style="display:none;">
  <div class="header-search-results-card">
    <div class="header-search-results-title">
      <span id="headerSearchResultsTitle">Arama sonuçları</span>
      <button type="button" id="headerSearchResultsClose" class="header-search-results-close" aria-label="Kapat">×</button>
    </div>
    <div id="headerSearchResultsList" class="header-search-results-list"></div>
  </div>
</div>
