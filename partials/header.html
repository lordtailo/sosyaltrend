<header>
  <div class="header-left">
    <button class="side-trigger left-trigger" type="button" onclick="toggleLeftSidebar()" aria-label="Sol menüyü aç">
      <i class="fa-solid fa-bars"></i>
    </button>
    <a href="javascript:void(0)" onclick="navigateTo('feed'); return false;" style="color:var(--text-main); font-size: 1.1rem; text-decoration: none; display: flex; align-items: center; gap: 10px;">
      <span class="logo" style="font-weight: bold;">SosyaLTrend</span>
    </a>
  </div>
  <div class="header-center"></div>


  <div class="header-right">
    <button class="side-trigger right-trigger" type="button" onclick="toggleRightSidebar()" aria-label="Sağ menüyü aç">
      <i class="fa-solid fa-bars"></i>
    </button>
    <button id="themeToggleBtn" class="theme-btn" onclick="toggleDarkMode()" title="Tema Değiştir"><i class="fa-solid fa-moon"></i></button>
    
    <div style="position:relative;">
      <button id="notificationsBtn" class="theme-btn" onclick="toggleNotifications()" title="Bildirimler" style="position:relative; display: flex; align-items: center; gap: 5px;">
        <i class="fa-solid fa-bell"></i>
        <span id="notificationCountBadge" class="notificationCountBadge" style="display:none; font-size: 0.8rem; font-weight: 700;">0 okunmamış</span>
        <span id="notificationBadge" style="display:none; position:absolute; top:2px; right:2px; background:#ef4444; width:8px; height:8px; border-radius:50%; border: 2px solid var(--header-bg);"></span>
      </button>
      
      <div id="notificationsDropdown" style="display:none; position:fixed; top:45px; right:0; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; width:340px; max-height:450px; overflow:hidden; z-index:1000; box-shadow:0 10px 30px rgba(0,0,0,0.2); flex-direction:column;">
        <div style="padding:12px 15px; border-bottom:1px solid var(--border); background:linear-gradient(135deg, var(--primary), #8b5cf6); color:white; border-radius:12px 12px 0 0; flex-shrink:0; display:flex; align-items:center; gap:10px; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:10px; flex:1;">
            <i class="fa-solid fa-bell"></i>
            <h4 style="margin:0; font-size:0.95rem; font-weight:700; display:inline-block;">Bildirim Kutusu</h4>
            <span class="requestCountBadge notificationCountBadge" style="background:rgba(255,255,255,0.3); padding:2px 8px; border-radius:12px; font-size:0.8rem; font-weight:600;">0 okunmamış</span>
          </div>
          <button onclick="navigateToProfileHash('my-notifs-tab'); return false;" style="background: rgba(255,255,255,0.18); color: white; border: none; padding:6px 10px; border-radius:8px; font-size:0.75rem; cursor:pointer; font-weight:700; white-space:nowrap; transition: all 0.2s ease;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.18)';">
            <i class="fa-solid fa-arrow-right"></i> Bildirimlerime Git
          </button>
        </div>
        <div id="friendRequestsList" style="flex:1; overflow-y:auto;"></div>
        <div id="noNotificationsMsg" style="padding:30px 20px; text-align:center; color:var(--text-muted); font-size:0.85rem; display:flex; flex-direction:column; align-items:center; justify-content:center;">
          <i class="fa-solid fa-inbox" style="font-size:2rem; margin-bottom:12px; opacity:0.5;"></i>
          <p style="margin:0; font-weight:500;">Yeni bildirim yok</p>
        </div>
      </div>
    </div>
    
    <div class="profile-trigger" id="profileTrigger">
        <img id="headerAvatar" src="" alt="Kullanıcı avatar">
      </div>
        <div class="dropdown-menu" id="dropdownMenu">
        <div style="padding: 10px; border-bottom: 1px solid var(--border); margin-bottom: 5px;">
            <p id="menuDisplayName" style="font-weight: 800; font-size: 0.85rem;">...</p>
            <p id="menuUsername" style="font-size: 0.75rem; color: var(--text-muted);">@...</p>
        </div>
        <button class="menu-style-btn" id="adminMenuBtn" onclick="navigateTo('admin'); return false;" style="display:none; color: var(--primary);">
    <i class="fa-solid fa-user-shield"></i> <span>Yönetici Paneli</span>
</button>
        
<button class="menu-style-btn" onclick="navigateTo('profil'); return false;"><i class="fa-solid fa-user"></i> <span data-i18n="menuProfile">Profiliniz</span></button>
        <button class="menu-style-btn" onclick="navigateTo('settings'); return false;"><i class="fa-solid fa-gear"></i> <span>Ayarlar</span></button>
        
<button class="menu-style-btn" onclick="logout()" style="color:#ef4444; border-top:1px solid var(--border); margin-top:5px;"><i class="fa-solid fa-right-from-bracket"></i> <span>Çıkış Yap</span></button>
    </div>
  </div>
</header>
