<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Blog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<div id="header-placeholder"></div>

<script>
console.log('[blog] Loading header...');
fetch('partials/header.html')
  .then(r => {
    console.log('[blog] Header fetch response:', r.status);
    return r.text();
  })
  .then(html => {
    const el = document.getElementById('header-placeholder');
    console.log('[blog] Header element found:', !!el, 'HTML length:', html.length);
    if (el) {
      el.innerHTML = html;
      console.log('[blog] Header inserted successfully');
    }
  })
  .catch(e => {
    console.error('[blog] Header fetch error:', e);
    console.warn('[blog] Header failed to load - refresh page');
  });
</script>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog" class="page-content active">
      <div class="glass-card" style="padding:20px;">
        <h2 style="margin-bottom:15px; color:var(--primary);">Blog Yazıları</h2>
        <div id="blogPostsContainer" style="margin-top:20px;">
            <!-- posts will be injected here by loadBlogPosts() -->
        </div>
      </div>
    </div>

  </main>

  <div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>

<script>
console.log('[blog] Loading footer...');
fetch('partials/footer.html')
  .then(r => {
    console.log('[blog] Footer fetch response:', r.status);
    return r.text();
  })
  .then(html => {
    const el = document.getElementById('footer-placeholder');
    console.log('[blog] Footer element found:', !!el, 'HTML length:', html.length);
    if (el) {
      el.innerHTML = html;
      console.log('[blog] Footer inserted successfully');
    }
  })
  .catch(e => {
    console.error('[blog] Footer fetch error:', e);
    console.warn('[blog] Footer failed to load - refresh page');
  });
</script>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
