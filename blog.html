<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Sosyal Ağ - Blog</title>
  <meta name="description" content="SosyaLTrend blog yazıları. Güncel trendler, teknoloji haberleri ve topluluk içerikleri.">
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div data-include="partials/topbar.html"></div>
  <div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog" class="page-content active">
      <div class="glass-card" style="padding: 20px;">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 22px;">
          <h2 id="blogPageTitle" style="margin: 0;">Blog Yazıları</h2>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <a href="blog.html" id="btn-blog-all" class="mini-link-btn">Tüm Yazılar</a>
            <a href="blog.html?mine=1" id="btn-blog-mine" class="mini-link-btn">Yazılarım</a>
            <a href="blog.html?create=1" id="btn-blog-create" class="mini-link-btn">Yeni Yazı</a>
          </div>
        </div>

        <div id="blogListView">
          <div id="mostReadSection" style="margin-bottom: 24px;">
            <div id="mostReadContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
          </div>

          <div id="blogCategoryFilters" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 18px;"></div>

          <div id="blogPostsContainer"></div>
        </div>

        <div id="blogCreateView" style="display:none;">
          <div style="margin-bottom: 16px;">
            <label for="blogTitle" style="font-weight: 700;">Başlık</label>
            <input id="blogTitle" type="text" class="form-input" placeholder="Yazı başlığı" style="width: 100%; margin-top: 8px;" required />
          </div>
          <div style="margin-bottom: 16px;">
            <label for="blogCategory" style="font-weight: 700;">Kategori</label>
            <select id="blogCategory" class="form-input" style="width: 100%; margin-top: 8px;" required>
              <option value="Genel">Genel</option>
              <option value="Teknoloji">Teknoloji</option>
              <option value="Yaşam">Yaşam</option>
              <option value="Haber">Haber</option>
              <option value="Eğitim">Eğitim</option>
              <option value="Seyahat">Seyahat</option>
            </select>
          </div>
          <div style="margin-bottom: 16px;">
            <label for="blogContent" style="font-weight: 700;">İçerik</label>
            <textarea id="blogContent" class="form-input" rows="10" placeholder="Yazınız buraya..." style="width: 100%; margin-top: 8px;" required></textarea>
          </div>
          <div style="display: flex; flex-wrap: nowrap; align-items: center; gap: 12px;">
            <button id="publishBlogBtn" class="form-btn" style="background: var(--primary); color: #fff; flex: 0 1 auto;">Yayınla</button>
            <button id="saveDraftBtn" class="form-btn" style="background: var(--warning); color: #1f2937; display: none; flex: 0 1 auto;">Taslak Olarak Kaydet</button>
          </div>
          <div style="margin-top: 10px;">
            <span id="blogStatus" style="color: var(--text-muted); font-size: 0.9rem;"></span>
          </div>
        </div>

        <div id="blogPostView" style="display:none;">
          <div class="glass-card" style="padding: 20px;">
            <h2 id="blogPostTitle" style="margin-top: 0;"></h2>
            <div id="blogPostCategory" style="color: var(--text-muted); margin-bottom: 10px; font-size: 0.9rem;"></div>
            <div id="blogPostActions" class="blog-post-actions" style="margin-bottom: 15px; display: flex; justify-content: flex-end; gap: 10px;"></div>
            <div id="blogPostContent" style="color: var(--text-main); line-height: 1.7;"></div>

            <div id="blogPostShare" style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
              <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                <button id="shareBtn" class="mini-link-btn" type="button">
                  <i class="fa-solid fa-share-nodes" style="margin-right: 6px;"></i>Paylaş
                </button>
                <button id="shareWhatsAppBtn" class="mini-link-btn" type="button">
                  <i class="fa-brands fa-whatsapp" style="margin-right: 6px;"></i>WhatsApp
                </button>
                <button id="shareFacebookBtn" class="mini-link-btn" type="button">
                  <i class="fa-brands fa-facebook-f" style="margin-right: 6px;"></i>Facebook
                </button>
                <button id="shareXBtn" class="mini-link-btn" type="button">
                  <i class="fa-brands fa-x" style="margin-right: 6px;"></i>X
                </button>
                <button id="copyPostLinkBtn" class="mini-link-btn" type="button">
                  <i class="fa-solid fa-link" style="margin-right: 6px;"></i>Linki Kopyala
                </button>
              </div>
              <span id="copyStatus" style="color: var(--text-muted); font-size: 0.85rem;"></span>
            </div>

            <div id="blogPostReaders" style="margin-top: 20px;">
              <h3 style="margin:0 0 10px 0; font-size:1.05rem;">Kimler okudu</h3>
              <div id="blogReadersList" style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;"></div>
            </div>

            <div id="blogPostComments" style="margin-top: 20px;">
              <h3 style="margin:0 0 10px 0; font-size:1.05rem;">Yorumlar</h3>
              <div id="blogCommentForm" style="margin-bottom: 16px;"></div>
              <div id="blogCommentList"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </main>

<div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div> 

<div id="editModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 90%; max-width: 500px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <h3 style="margin: 0;">Gönderiyi Düzenle</h3>
            <button onclick="closeEditModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">&times;</button>
        </div>
        <div id="editPostInput" contenteditable="true" style="width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: transparent; color: var(--text-main); outline: none; resize: vertical;" data-placeholder="Burada düzenleyin..."></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button onclick="closeEditModal()" style="padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer;">İptal</button>
            <button id="saveEditBtn" style="padding: 8px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">Kaydet</button>
        </div>
    </div>
</div>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>

</body>
</html>
