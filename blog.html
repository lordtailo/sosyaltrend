<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Blog</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div class="top-bar">
    <div class="top-bar-left">
      <span id="welcomeMessage" style="opacity: 0.8;"><i class="fa-solid fa-circle-check" style="font-size: 0.6rem; animation: pulse 2s infinite;"></i> Yükleniyor...</span>
    </div>
    <div class="top-bar-right"><span id="topBarDateTime"><i class="fa-regular fa-clock"></i> Yükleniyor...</span></div>
  </div>

<div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

  <main id="main-content">

    <div id="page-blog" class="page-content active">
      <div class="glass-card" style="padding:20px;">
        <h2 style="margin-bottom:15px; color:var(--primary);">Blog Yazıları</h2>
        <div id="blogPostsContainer" style="margin-top:20px;">
          <div class="glass-card" style="padding:15px 20px; margin-bottom:20px;">
            <h3 style="margin-top:0;">Örnek Blog Yazısı</h3>
            <p style="color:var(--text-muted); font-size:0.95rem; line-height:1.6;">
              Bu bölümde blog yazılarınız listelenecek. İleride Firestore'dan çekilmiş gerçek içerikler gösterilecek.
            </p>
            <a href="#" class="mini-link-btn" style="margin-top:10px; display:inline-block;">Devamını Oku →</a>
          </div>
          <p style="color:var(--text-muted);">Henüz daha fazla yazı yok.</p>
        </div>
      </div>
    </div>

  </main>

  <div data-include="partials/right-aside.html"></div>
</div>


<div id="footer-placeholder"></div>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
