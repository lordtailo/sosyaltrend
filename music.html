<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Sosyal Ağ - Müzik Dinle</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>

  <div data-include="partials/topbar.html"></div>
  <div id="header-placeholder"></div>

  <div class="app-container">
    <div data-include="partials/left-aside.html"></div>

    <main id="main-content">
      <div id="page-music" class="page-content active">
        <div class="glass-card" style="padding:20px;">
          <div style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:18px;">
            <div>
              <h2 style="margin:0;">Müzik Dinle</h2>
              <p style="margin:8px 0 0 0; color: var(--text-muted);">Burada müziklerınızı dinleyebilir, yeni müzikler ekleyebilir ve sistemde yayınlayabilirsiniz.</p>
            </div>
          </div>

          <div id="musicAuthNotice" style="display:none; margin-bottom:18px; padding:14px; border-radius:14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text-muted);">
            Müzik eklemek için lütfen giriş yapın.
          </div>

          <div class="glass-card" style="padding:18px; margin-bottom:20px;">
            <h3 style="margin-top:0;">Yeni Müzik Ekle</h3>
            <div style="display:grid; gap:16px;">
              <div>
                <label for="musicTitle" style="font-weight:700;">Müzik Başlığı</label>
                <input id="musicTitle" class="form-input" type="text" placeholder="Müzik parçanızın başlığını girin" />
              </div>
              <div>
                <label for="musicDescription" style="font-weight:700;">Açıklama</label>
                <textarea id="musicDescription" class="form-input" rows="4" placeholder="Müzik parçanız hakkında kısa bilgi..."></textarea>
              </div>
              <div>
                <label for="musicUrl" style="font-weight:700;">Müzik URL'si</label>
                <input id="musicUrl" class="form-input" type="text" placeholder="YouTube, SoundCloud veya doğrudan MP3 bağlantısı" />
              </div>
              <div>
                <label for="musicFile" style="font-weight:700;">Müzik Dosyası Yükle</label>
                <input id="musicFile" class="form-input" type="file" accept="audio/*" />
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
                <button id="musicSubmit" class="form-btn" style="background: var(--primary); color:#fff;">Müziği Yükle</button>
                <span id="musicStatus" style="color: var(--text-muted);"></span>
              </div>
            </div>
          </div>

          <div id="musicList" style="display:grid; gap:18px;"></div>
        </div>
      </div>
    </main>

    <div data-include="partials/right-aside.html"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/include.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
