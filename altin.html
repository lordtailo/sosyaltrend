<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SosyaLTrend • Portföy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --gold: #fbbf24; --up: #10b981; --down: #ef4444; --text: #f8fafc; }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
    .app-wrapper { width: 100%; max-width: 400px; }
    .hero-card { background: linear-gradient(to bottom right, #1e293b, #0f172a); border: 1px solid var(--gold); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 15px; }
    .hero-card h1 { font-size: 2.5rem; margin: 10px 0; color: var(--gold); }
    .stats { display: flex; gap: 10px; margin-bottom: 15px; }
    .stat-item { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .input-group { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; background: #0f172a; color: white; box-sizing: border-box; }
    button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--gold); font-weight: bold; cursor: pointer; }
    #status { font-size: 0.8rem; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="app-wrapper">
  <div class="hero-card">
    <small>TOPLAM PORTFÖY</small>
    <h1 id="total-tl">0,00 ₺</h1>
    <div id="display-gram">0.00 gr Altın</div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <small>Gram Alış</small>
      <div id="buy-price" style="color:var(--up); font-weight:bold; margin-top:5px;">Bekleniyor...</div>
    </div>
    <div class="stat-item">
      <small>Gram Satış</small>
      <div id="sell-price" style="color:var(--down); font-weight:bold; margin-top:5px;">Bekleniyor...</div>
    </div>
  </div>

  <div class="input-group">
    <input type="number" id="gram-input" placeholder="Kaç gram altın var?">
    <button id="save-btn">KAYDET</button>
    <div id="status"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBegJHqlfPagx8biFyS_FnE3iXOksgfoAU",
    authDomain: "sosyaltrend-21d21.firebaseapp.com",
    projectId: "sosyaltrend-21d21",
    storageBucket: "sosyaltrend-21d21.firebasestorage.app",
    messagingSenderId: "207734473261",
    appId: "1:207734473261:web:f31b6bf2908c6d88986ea4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const uid = "global_user"; // Test için sabitlendi
  let currentGoldPrice = 0;

  // VERİ ÇEKME FONKSİYONU
  async function updatePrices() {
    try {
      // Veri çekilemezse sistem çökmesin diye varsayılan bir değer atıyoruz
      const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://finans.truncgil.com/today.json')}`);
      const json = await res.json();
      const data = JSON.parse(json.contents);
      
      const buy = parseFloat(data["Gram Altın"].Buying.replace('.','').replace(',','.'));
      const sell = parseFloat(data["Gram Altın"].Selling.replace('.','').replace(',','.'));
      
      currentGoldPrice = buy;
      document.getElementById('buy-price').innerText = buy.toLocaleString('tr-TR') + " ₺";
      document.getElementById('sell-price').innerText = sell.toLocaleString('tr-TR') + " ₺";
      calculate();
    } catch (e) {
      console.error("Fiyat çekilemedi, manuel mod aktif.");
      // API çalışmazsa geçici olarak 3000 TL kabul et (Sistemi test etmek için)
      currentGoldPrice = 3000;
      document.getElementById('buy-price').innerText = "3.000,00 ₺ (API Hatası)";
      calculate();
    }
  }

  function calculate() {
    const gram = parseFloat(localStorage.getItem('my_gold')) || 0;
    const total = gram * currentGoldPrice;
    document.getElementById('display-gram').innerText = gram.toFixed(2) + " gr Altın";
    document.getElementById('total-tl').innerText = total.toLocaleString('tr-TR') + " ₺";
  }

  // FIREBASE DİNLEME
  onSnapshot(doc(db, "portfolios", uid), (snap) => {
    if (snap.exists()) {
      localStorage.setItem('my_gold', snap.data().goldAmount);
      calculate();
    }
  });

  // KAYDETME
  document.getElementById('save-btn').onclick = async () => {
    const val = parseFloat(document.getElementById('gram-input').value);
    if (!isNaN(val)) {
      try {
        await setDoc(doc(db, "portfolios", uid), { goldAmount: val }, { merge: true });
        document.getElementById('status').innerText = "✅ Kaydedildi!";
      } catch (err) {
        document.getElementById('status').innerText = "❌ Hata: " + err.message;
      }
    }
  };

  updatePrices();
  setInterval(updatePrices, 60000);
</script>
</body>
</html>
