<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SosyaLTrend - Ücretsiz sosyal ağ platformu. Trendleri takip edin, arkadaşlarınızla bağlantı kurun, topluluklar oluşturun.">
  <meta name="keywords" content="sosyaltrend,sosyal ağ,sosyal,ağ,sosyalağ,ücretsiz sosyal ağ">
  <title>SosyaLTrend • Sosyal Ağ - Anasayfa</title>
  <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/chat-widget.css?v=20260240">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
<!-- modern mobile web app capability (replaces deprecated apple tag) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6366f1">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</head>
<body>
  
  <div data-include="partials/topbar.html"></div>
  <div id="header-placeholder"></div>

<div class="app-container">
  <div data-include="partials/left-aside.html"></div>

 <main id="main-content">
    <div id="page-feed" class="page-content active">
        <div class="glass-card">
            <div style="padding: 20px;">
                <div id="postInput" contenteditable="true" oninput="updatePostCount()" style="width:100%; border:none; outline:none; resize:none; font-size:1.1rem; min-height:80px;" data-placeholder="Gönderinizi buraya yazın..." data-i18n-placeholder="postPlaceholder"></div>
                <div style="text-align:right; font-size:0.75rem; color:var(--text-muted);" id="post-charcount">0/280</div>
                
                <div id="imagePreviewContainer" style="display: none; position: relative; margin-top: 10px; width: fit-content;">
                    <img id="imagePreview" src="" alt="Gönderi resmi önizlemesi" style="max-width: 200px; max-height: 200px; border-radius: 12px; border: 1px solid var(--border);">
                    <button type="button" onclick="clearImagePreview()" style="position: absolute; top: -10px; right: -10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding: 15px 20px;">
                <div style="display:flex; gap:8px; position: relative;">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    
                    <button class="tool-btn" type="button" onclick="document.getElementById('imageInput').click()">
                        <i class="fa-regular fa-image"></i>
                    </button>
                    <button class="tool-btn" id="emojiToggle" type="button"><i class="fa-regular fa-face-smile"></i></button>
                    
                    <div id="emojiPicker" class="glass-card" style="display: none; position: absolute; top: -143px; left: 126px; z-index: 100; padding: 4px; width: 200px; grid-template-columns: repeat(7, 1fr); gap: 6px;">
                        <!-- içerik JavaScript tarafından dolduruluyor -->
                    </div>
                </div>
                <button id="shareBtn" style="background: var(--primary); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: 700; cursor: pointer;" data-i18n="shareBtn">Paylaş</button>
            </div>
        </div>
        <div id="feed-items"></div>
    </div>
</main>

<div data-include="partials/right-aside.html"></div>
</div>


<div id="editModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 90%; max-width: 500px; padding: 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <h3 style="margin: 0;">Gönderiyi Düzenle</h3>
            <button onclick="closeEditModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">&times;</button>
        </div>
        <div id="editPostInput" contenteditable="true" style="width: 100%; min-height: 120px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: transparent; color: var(--text-main); outline: none; resize: vertical;" data-placeholder="Burada düzenleyin..."></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button onclick="closeEditModal()" style="padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer;">İptal</button>
            <button id="saveEditBtn" style="padding: 8px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">Kaydet</button>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/include.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
