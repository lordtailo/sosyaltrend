<body>
  <div data-include="partials/topbar.html"></div>`r`n`r`n<div id="header-placeholder"></div>

  <div class="app-container">
    <div data-include="partials/left-aside.html"></div>

    <main id="main-content">
      <div class="glass-card">
        <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div>
            <h2 style="margin: 0;">Profil • Gönderiler</h2>
            <p style="margin: 6px 0 0; color: var(--text-muted); font-size: 0.95rem;">Profilinizde paylaştığınız tüm gönderiler.</p>
          </div>
          <div style="display:flex; flex-wrap: wrap; gap: 10px;">
            <a href="begeniler.html" class="form-btn" style="white-space: nowrap;">Beğeniler</a>
            <a href="kayitlar.html" class="form-btn" style="white-space: nowrap;">Kayıtlar</a>
          </div>
        </div>
      </div>

      <div class="glass-card" style="margin-top: 16px; padding: 20px;">
        <div id="my-posts-list" style="display:grid; gap: 16px;"></div>
        <div id="no-posts-msg" style="display:none; text-align:center; margin-top: 30px; color: var(--text-muted); font-size: 0.95rem;">Henüz paylaşılmış gönderi yok.</div>
      </div>
    </main>

    <div data-include="partials/right-aside.html"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="assets/js/include.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script>
    (function() {
      let attempts = 0;
      const checkReady = setInterval(() => {
        if (typeof window.loadProfileSections === 'function' && typeof window.auth !== 'undefined') {
          clearInterval(checkReady);
          window.loadProfileSections('posts');
        } else if (attempts > 20) {
          clearInterval(checkReady);
          console.error('Profil gönderiler sayfası yüklenemedi: loadProfileSections hazır değil.');
        }
        attempts++;
      }, 250);
    })();
  </script>
</body>
