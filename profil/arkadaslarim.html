<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Arkadaşlarım</title>
  <link rel="stylesheet" href="../assets/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/chat-widget.css?v=20260240">
  <link rel="icon" type="image/x-icon" href="../assets/img/strendsaydamv2.ico">
</head>
<body>
  <div data-include="../partials/topbar.html"></div>
  <div id="header-placeholder"></div>

  <div class="app-container">
    <div data-include="../partials/left-aside.html"></div>

    <main id="main-content">
      <div class="glass-card">
        <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
          <div>
            <h2 style="margin: 0;">Arkadaşlarım</h2>
            <p style="margin: 6px 0 0; color: var(--text-muted); font-size: 0.95rem;">Arkadaş listenizi buradan görüntüleyebilirsiniz.</p>
          </div>

        </div>
        <div style="display:flex; gap:10px; flex-wrap: wrap; margin-top: 20px;">
          <input id="friendSearch" type="text" placeholder="Arkadaş ara..." style="flex:1; min-width: 180px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); outline: none;" />
          <button type="button" onclick="applyFriendSearch()" class="form-btn" style="padding: 12px 22px;">Ara</button>
        </div>
      </div>

      <div class="glass-card" style="margin-top: 16px; padding: 20px;">
        <div id="friends-list" style="display:grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));"></div>
        <div id="no-friends-msg" style="display:none; text-align:center; margin-top: 30px; color: var(--text-muted); font-size: 0.95rem;">Henüz arkadaş listenizde kimse yok.</div>
      </div>
    </main>

    <div data-include="../partials/right-aside.html"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../assets/js/include.js"></script>
  <script type="module" src="../assets/js/app.js"></script>
  <script>
    (function() {
      let attempts = 0;
      const checkReady = setInterval(() => {
        if (typeof window.loadFriendsList === 'function' && typeof window.auth !== 'undefined') {
          clearInterval(checkReady);
          window.loadFriendsList(null, true);
        } else if (attempts > 20) {
          clearInterval(checkReady);
          console.error('Profil arkadaşlar sayfası yüklenemedi: loadFriendsList hazır değil.');
        }
        attempts++;
      }, 250);
    })();
  </script>
</body>
</html>
