<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SosyaLTrend • Sosyal Ağ - Topluluklar</title>
  <meta name="description" content="SosyaLTrend'de toplulukları keşfedin. İlgi alanlarınıza göre topluluklara katılın ve benzer düşünen insanlarla bağlantı kurun.">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="assets/img/strendsaydamv2.ico">
</head>
<body>
  <div data-include="partials/topbar.html"></div>
  <div id="header-placeholder"></div>

  <div class="app-container">
    <div data-include="partials/left-aside.html"></div>

    <main id="main-content">

      <!-- Topluluk Başlığı ve Arama -->
      <div class="glass-card" style="padding: 30px; margin-top: 20px; margin-bottom: 20px; border: 1px solid rgba(99,102,241,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; flex-wrap: wrap;">
          <div>
            <h1 style="margin: 0 0 6px 0; font-size: 2rem; color: var(--text-main);">
              <i class="fa-solid fa-users" style="color: var(--primary); margin-right: 10px;"></i>Topluluklar
            </h1>
            <p style="margin: 0; color: var(--text-secondary);">İlgi alanlarına göre toplulukları keşfet, katıl ve yeni insanlarla bağlantı kur.</p>
          </div>
          <button id="createCommunityBtn" style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.95rem;">
            <i class="fa-solid fa-plus" style="margin-right: 8px;"></i>Topluluk Oluştur
          </button>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
          <input type="text" id="searchCommunities" placeholder="Topluluk ara..." style="flex: 1; min-width: 220px; padding: 10px 15px; border: 1px solid var(--border); border-radius: 20px; background: transparent; color: var(--text-main); outline: none;">
          <select id="categoriesFilter" style="padding: 10px 15px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-secondary); color: var(--text-main); cursor: pointer; outline: none;">
            <option value="">Tüm Kategoriler</option>
            <option value="teknoloji">Teknoloji</option>
            <option value="sanat">Sanat</option>
            <option value="spor">Spor</option>
            <option value="egitim">Eğitim</option>
            <option value="oyunlar">Oyunlar</option>
            <option value="muzik">Müzik</option>
            <option value="yemek">Yemek & Mutfak</option>
            <option value="seyahat">Seyahat</option>
            <option value="diger">Diğer</option>
          </select>
        </div>
      </div>

      <div id="communityDetailView" style="display:none; margin-bottom: 30px;"></div>

      <!-- Topluluk Listeleri -->
      <div id="communitiesContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px;">
        
      </div>

      <!-- Boş Durum Mesajı -->
      <div id="emptyState" style="display: none; text-align: center; padding: 60px 20px; background: rgba(255,255,255,0.03); border-radius: 20px; border: 1px dashed var(--border);">
        <i class="fa-solid fa-search" style="font-size: 3rem; color: var(--text-secondary); margin-bottom: 20px;"></i>
        <h2 style="color: var(--text-main); margin-bottom: 10px;">Henüz topluluk yok</h2>
        <p style="color: var(--text-secondary); margin-bottom: 20px;">Aradığınız kriterlere uygun topluluk bulunamadı. Yazdığınız kelimeyi değiştirin ya da yeni bir topluluk oluşturun.</p>
      </div>

    </main>

    <div data-include="partials/right-aside.html"></div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Topluluk Düzenle Modal -->
  <div id="editCommunityModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 90%; max-width: 500px; padding: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--text-main);">Topluluğu Düzenle</h2>
        <button onclick="closeEditCommunityModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">&times;</button>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Topluluk Adı</label>
        <input type="text" id="editCommunityName" style="width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); outline: none; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Kategori</label>
        <select id="editCommunityCategory" style="width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-main); outline: none; box-sizing: border-box;">
          <option value="teknoloji">Teknoloji</option>
          <option value="sanat">Sanat</option>
          <option value="spor">Spor</option>
          <option value="egitim">Eğitim</option>
          <option value="oyunlar">Oyunlar</option>
          <option value="muzik">Müzik</option>
          <option value="yemek">Yemek & Mutfak</option>
          <option value="seyahat">Seyahat</option>
          <option value="diger">Diğer</option>
        </select>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Açıklama</label>
        <textarea id="editCommunityDescription" style="width: 100%; height: 100px; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); outline: none; box-sizing: border-box; resize: vertical;"></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="closeEditCommunityModal()" style="padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-main);">İptal</button>
        <button onclick="saveEditedCommunity()" style="padding: 10px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- Topluluk Oluştur Modal -->
  <div id="createCommunityModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div class="glass-card" style="width: 90%; max-width: 500px; padding: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="margin: 0; color: var(--text-main);">Yeni Topluluk Oluştur</h2>
        <button onclick="closeCommunityModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main);">&times;</button>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Topluluk Adı</label>
        <input type="text" id="communityName" placeholder="Örn: Web Geliştirme" style="width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); outline: none; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Kategori</label>
        <select id="communityCategory" style="width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-secondary); color: var(--text-main); outline: none; box-sizing: border-box;">
          <option value="">Kategori Seç</option>
          <option value="teknoloji">Teknoloji</option>
          <option value="sanat">Sanat</option>
          <option value="spor">Spor</option>
          <option value="egitim">Eğitim</option>
          <option value="oyunlar">Oyunlar</option>
          <option value="muzik">Müzik</option>
          <option value="yemek">Yemek & Mutfak</option>
          <option value="seyahat">Seyahat</option>
          <option value="diger">Diğer</option>
        </select>
      </div>

      <div style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; color: var(--text-main); font-weight: bold;">Açıklama</label>
        <textarea id="communityDescription" placeholder="Topluluk hakkında kısa bir açıklama..." style="width: 100%; height: 100px; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--text-main); outline: none; box-sizing: border-box; resize: vertical;"></textarea>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-main);">
          <input type="checkbox" id="communityPrivate" style="cursor: pointer;">
          <span>Özel Topluluk (yalnızca davetliler katılabilir)</span>
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="closeCommunityModal()" style="padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-main);">İptal</button>
        <button onclick="createNewCommunity()" style="padding: 10px 20px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer;">Oluştur</button>
      </div>
    </div>
  </div>

  <script src="assets/js/include.js"></script>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/community.js"></script>

</body>
</html>
