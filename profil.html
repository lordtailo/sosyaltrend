  <style>
    /* Taşıma Sorunu İçin Genel Düzeltme */
    html, body {
        overflow-x: hidden;
        width: 100%;
        position: relative;
    }

    /* Galeri ve Albüm Entegre Stilleri - Responsive Güncelleme */
    .album-container {
        margin-bottom: 25px;
        padding: 15px;
        background: rgba(var(--primary-rgb, 99, 102, 241), 0.05);
        border-radius: 18px;
        border: 1px solid var(--border);
        box-sizing: border-box;
    }
    .album-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding: 0 5px;
    }
    .album-title {
        font-weight: 800;
        font-size: 1rem;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .gallery-grid {
        display: grid;
        /* Mobil öncelikli: varsayılan 3 sütun */
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        min-height: 50px;
    }
    
    @media (min-width: 768px) {
        .gallery-grid {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
    }

    .gallery-item {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        overflow: hidden;
        background: var(--input-bg);
        border: 1px solid var(--border);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
    }
    .gallery-item:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        border-color: var(--primary);
    }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    
    .delete-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 0.2s ease;
        z-index: 10;
    }
    /* Mobilde silme butonunun görünürlüğü için dokunma desteği */
    @media (hover: none) {
        .delete-overlay { opacity: 1; background: transparent; pointer-events: none; }
        .delete-btn { pointer-events: auto; transform: scale(0.8); position: absolute; top: 5px; right: 5px; }
    }
    .gallery-item:hover .delete-overlay { opacity: 1; }
    .delete-btn {
        background: var(--danger); color: white; border: none;
        width: 32px; height: 32px; border-radius: 50%;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
  </style>
  <style>
    /* Profil Sekme Stilleri */
    .profile-tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto; white-space: nowrap; -ms-overflow-style: none; scrollbar-width: none; }
    .profile-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: #fff; border: none; padding: 10px 20px; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 10px; transition: all 0.3s; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tab-btn.active { background: var(--primary); color: white; }
    .tab-content { display: none; animation: fadeIn 0.4s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Profil Düzenleme Formu */
    .edit-profile-form { display: none; margin-top: 20px; animation: slideDown 0.3s ease; }
    .edit-profile-form.active { display: block; }
    @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 1000px; } }
    .section-subtitle { font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
    .form-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text-main); outline: none; font-size: 0.9rem; box-sizing: border-box; }
    .form-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .form-btn:hover { opacity: 0.9; }
    .admin-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .admin-btn:hover { opacity: 0.9; }

    /* Ayarlar menüsü stili */
    .profile-settings-menu { display: none; position: absolute; top: 100%; right: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 10000; min-width: 180px; }
    .profile-settings-menu.visible { display: block; }
    .profile-settings-item { padding: 10px 15px; font-size: 0.9rem; cursor: pointer; }
    .profile-settings-item:hover { background: var(--input-bg); }

    /* Mobile adjustments for profile page */
    @media (max-width: 768px) {
        /* stack action buttons vertically */
        .profile-actions { flex-direction: column; align-items: stretch; }
        .profile-actions button { width: 100%; }
        /* reduce padding on main card */
        #page-profile > .glass-card { padding: 20px 15px; }
        /* tabs scrollable and smaller buttons */
        .profile-tabs { gap: 5px; }
        .tab-btn { padding: 8px 12px; font-size: 0.75rem; }
        /* friend search full width */
        #friendSearch { width: 100%; }
        /* friend list grid for small screens */
        #friends-list { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        /* gallery grid default to 2 columns on small screens */
        .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        /* make edit form inputs full width */
        .edit-profile-form .form-input { width: 100%; }
    }
  </style>
</head>

<script>
    let currentTargetGrid = null;
    let galleryData = JSON.parse(localStorage.getItem('userGalleryData')) || {
        albums: [{ id: 'grid-default', name: 'Genel Galeri', photos: [] }]
    };

    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = "none";
            tabcontent[i].classList.remove("active");
        }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) {
            tablinks[i].classList.remove("active");
        }
        document.getElementById(tabName).style.display = "block";
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
        
        // Ensure profile data is loaded when switching to posts/likes/saves tabs
        if (['my-posts-tab','my-likes-tab','my-saves-tab'].includes(tabName)) {
            requestAnimationFrame(() => {
                if (window.loadProfileSections && typeof window.loadProfileSections === 'function') {
                    try {
                        window.loadProfileSections();
                    } catch(e) {
                        console.warn('loadProfileSections call failed:', e);
                    }
                }
            });
        }
        
        if (tabName === 'my-friends-tab') {
            requestAnimationFrame(() => {
                if (window.loadFriendsList && window.user && window.auth?.currentUser) {
                    const params = new URLSearchParams(location.search);
                    const visitedUsername = params.get('id');
                    const isOwnProfile = !visitedUsername || visitedUsername === window.user.username;
                    
                    // Başlık ve buton yazısını güncelle
                    const titleEl = document.getElementById('friends-tab-title');
                    const btnEl = document.getElementById('friends-tab-btn');
                    if (isOwnProfile) {
                        if (titleEl) titleEl.innerText = 'Arkadaşlarım';
                        if (btnEl) btnEl.innerHTML = '<i class="fa-solid fa-users"></i> Arkadaşlar';
                    } else {
                        if (titleEl) titleEl.innerText = 'Ortak Arkadaşlar';
                        if (btnEl) btnEl.innerHTML = '<i class="fa-solid fa-handshake"></i> Ortak Arkadaşlar';
                    }
                    
                    setTimeout(() => {
                        // clear search field each time tab opens
                        const searchInput = document.getElementById('friendSearch');
                        if (searchInput) searchInput.value = '';
                        window.loadFriendsList(null, isOwnProfile);
                        // friend search filtering - simple helper
                        if (searchInput) {
                            searchInput.oninput = () => {
                                console.log('friend search input:', searchInput.value);
                                applyFriendSearch();
                            };
                        }
                    }, 0);
                }
            });
        }
        if (tabName === 'my-notifs-tab') {
          requestAnimationFrame(() => {
            if (window.loadProfileNotifications) setTimeout(() => window.loadProfileNotifications(), 0);
          });
        }
    }

    function openGalleryUpload(gridId) {
        currentTargetGrid = gridId;
        document.getElementById('masterGalleryInput').click();
    }

    function handleImageProcessing(input) {
        if (input.files && input.files[0] && currentTargetGrid) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const album = galleryData.albums.find(a => a.id === currentTargetGrid);
                if(album) {
                    album.photos.push(e.target.result);
                    saveAndRender();
                }
            };
            reader.readAsDataURL(input.files[0]);
            input.value = ""; 
        }
    }
</script>
<script>
window.handleProfileAction = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id') || urlParams.get('uid'); 

    if (!targetId) {
        alert("Hata: Bir kullanıcı profili seçilmedi. Lütfen ana sayfadan bir profile tıklayın.");
        return;
    }

    const currentUser = (typeof auth !== 'undefined') ? auth.currentUser : null;

    if (currentUser && (targetId === currentUser.uid || targetId === currentUser.displayName)) {
        window.location.href = "mesajlar.html";
    } else {
        window.location.href = "mesajlar.html?start=" + encodeURIComponent(targetId);
    }
};

window.addEventListener('load', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const targetId = urlParams.get('id') || urlParams.get('uid');
    const btn = document.getElementById('profileActionBtn');
    
    if (!targetId && btn) {
        btn.style.opacity = "0.5";
        btn.title = "Kullanıcı belirlenemedi";
    }
});
</script>

<script>
// After app.js loads, populate profile sections directly
setTimeout(() => {
  if (typeof window.loadProfileSections === 'function') {
    window.loadProfileSections();
  } else {
    console.warn('loadProfileSections not ready');
  }

  // Eğer URL'de hash varsa ilgili sekmeyi aç (örn. #my-notifs-tab)
  try {
    const h = window.location.hash || '';
    if (h) {
      const tabName = h.replace('#', '');
      const tabBtn = document.querySelector(`.tab-btn[onclick*="${tabName}"]`);
      if (tabBtn) {
        // Önce doğrudan click dene, işe yaramazsa openTab ile sentetik event gönder
        setTimeout(() => {
          try {
            tabBtn.click();
          } catch (e) {
            try { openTab({ currentTarget: tabBtn }, tabName); } catch (err) { console.warn('tab open failed', err); }
          }
          // ekstra güvenlik: eğer click didn't trigger, call openTab anyway
          try { openTab({ currentTarget: tabBtn }, tabName); } catch (err) { /* ignore */ }
        }, 200);
      }
    }
  } catch (e) { console.warn('Hash tab opener error:', e); }

}, 1000);
</script>

</body>
